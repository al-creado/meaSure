name: Build APK

# The release APK is built ONLY when `main` is pushed, or on demand from the Actions tab
# (Actions -> Build APK -> Run workflow). Download it from the run's "Artifacts" section.
# Pushes to `testing` only run the analyze + test job.
on:
  push:
    branches: [main, testing]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build release APK
    # Not on `testing`: only main, or a manual run.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # AGP 9 / Gradle 9 need JDK 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "measure-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: measure-apk
          path: measure-*.apk
          if-no-files-found: error
          retention-days: 30

  checks:
    # Separate job so a failing test never stops you from getting an APK. Runs on every push.
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
