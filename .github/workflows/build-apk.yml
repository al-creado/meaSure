name: Build APK

# The release APK is built ONLY when `main` is pushed, or on demand from the Actions tab
# (Actions -> Build APK -> Run workflow). Pushes to `testing` only run analyze + test.
#
# The APK is published as a plain file on the "latest" GitHub Release (workflow artifacts are
# always zipped, a release asset is not):
#   https://github.com/<owner>/<repo>/releases/latest/download/measure-app.apk
on:
  push:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build release APK
    # Not on `testing`: only main, or a manual run.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # AGP 9 / Gradle 9 need JDK 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk measure-app.apk

      # Replace the rolling "latest" release so the download link never changes.
      - name: Publish as a plain .apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest measure-app.apk \
            --target "$GITHUB_SHA" \
            --title "MeaSure (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download measure-app.apk and open it on your phone to install."

  checks:
    # Separate job so a failing test never stops you from getting an APK. Runs on every push.
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
